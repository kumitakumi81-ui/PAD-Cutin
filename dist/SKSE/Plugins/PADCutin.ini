; PAD Cutin 1.0.0 - Procedural Armor Damage で防具が壊れたときのカットイン
; ゲーム中に保存すると数秒で読み直されます

[General]
; プレイヤーのカットイン (1=有効 / 0=無効)
bCutinPlayer=1
; 防具が壊れて外れたとき (ArmorTear_OnBroken) にカットイン
bOnBreak=1
; 大きく破れたときにもカットイン (防具の残りがこの % 以下になった最初の1回。修理でリセット)
bOnHeavyTear=0
fHeavyTearIntegrity=40

[Cutin]
; カットイン中のゲーム速度 (0.10 = 10分の1) / 長さ (1.0 で約3秒)
fCutinSlowMo=0.1
fCutinLength=1
; カメラ距離: 壊れた部位 / 顔
fCutinPartDistance=42
fCutinFaceDistance=75
; ヒットストップ(秒、0でなし) / 白フラッシュ / その強さ
fCutinHitStop=0.12
bCutinFlash=1
fCutinFlashStrength=0.6
; 上下黒帯 / 放射ブラー / カメラの揺れ(0で揺らさない) / 毎回アングルを変える
; (黒帯・周辺を暗く・集中線は SKSE Menu Framework が必要)
bCutinLetterbox=1
bCutinBlur=1
fCutinShake=2
bCutinRandomAngle=1
; 顔のアップ: 小さな動き / カメラの傾き(度) / 集中線 / 周辺を暗く
bCutinFaceAction=1
fCutinDutch=10
bCutinSpeedLines=0
bCutinVignette=1
; 次のカットインまでの最短秒数
fCutinCooldown=15
; カットイン中はその場に留める / 動いてよい半径
bCutinHold=1
fCutinHoldRadius=24
