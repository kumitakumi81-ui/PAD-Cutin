; BF Heredity 0.2.0 設定
; Beeing Female NG のプレイヤーの子供が父母の見た目を受け継ぎ、付けた名前が残るようにする

[General]
; 父母の見た目を受け継ぐ
bInherit=1
; 生まれたときに名前の入力画面を出す
bNameOnBirth=1
; 子供に照準を合わせてこのキーを押すと名前を変えられる（DirectXキーコード。49 = N キー）
iRenameKey=49

[Inherit]
; 髪型・眉（子供の種族に合うものだけ）
bHairStyle=1
; 目
bEyes=1
; 顔の形（スライダーを父母の間で混ぜる）
bFaceShape=1
; 肌の色
bSkinTone=1

[DNA]
; DNA機能（NPCのDNAを採取して、使うと Fill Her Up と Beeing Female に反映）
bDNA=1
; NPCに照準を合わせてこのキーでDNAを採取（36 = J キー）
iCollectKey=36
; 男性からのみ採取できる
bMaleOnly=1
; 孕みやすさの出やすさ（NPCごとに最初の採取で決まる）。30% : 50% : 100% = 6 : 3 : 1
iWeight30=6
iWeight50=3
iWeight100=1
; DNAを使ったときの Fill Her Up の量
fFHUAmount=1.0
