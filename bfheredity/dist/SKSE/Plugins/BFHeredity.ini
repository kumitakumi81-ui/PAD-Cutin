; BF Heredity 0.1.0 設定
; Beeing Female NG のプレイヤーの子供が父母の見た目を受け継ぎ、付けた名前が残るようにする

[General]
; 父母の見た目を受け継ぐ
bInherit=1
; 生まれたときに名前の入力画面を出す
bNameOnBirth=1
; 子供に照準を合わせてこのキーを押すと名前を変えられる（DirectXキーコード。49 = N キー）
iRenameKey=49

[Inherit]
; 髪型・眉（子供の種族に合うものだけ）
bHairStyle=1
; 目
bEyes=1
; 顔の形（スライダーを父母の間で混ぜる）
bFaceShape=1
; 肌の色
bSkinTone=1
