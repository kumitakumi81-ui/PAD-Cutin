; BF Heredity 0.4.0 設定
; Beeing Female NG のプレイヤーの子供が父母の見た目を受け継ぎ、付けた名前が残るようにする

[General]
; 父母の見た目を受け継ぐ
bInherit=1
; 生まれたときに名前の入力画面を出す
bNameOnBirth=1
; 子供に照準を合わせてこのキーを押すと名前を変えられる（DirectXキーコード。49 = N キー）
iRenameKey=49

[Inherit]
; 髪型・眉（子供の種族に合うものだけ）
bHairStyle=1
; 目
bEyes=1
; 顔の形（スライダーを父母の間で混ぜる）
bFaceShape=1
; 肌の色
bSkinTone=1

[DNA]
; 採取した精液の瓶を相手の足元に落とす（0 = 直接インベントリへ）
bDropBottle=1
; 精液の採取機能（男性NPCに話しかけて採取し、使うと Fill Her Up と Beeing Female に反映）
bDNA=1
; 会話の代わりにキーでも採取したいときのキー（0 = 会話のみ。例：36 = J キー）
iCollectKey=0
; 男性からのみ採取できる
bMaleOnly=1
; 孕みやすさは、採取したときにそのNPCが溜めている量（Beeing Female の精力 0.02〜1.0）で決まる
; この値以上なら 100%
fVirility100=0.9
; この値以上なら 50%、それ未満は 30%
fVirility50=0.5
; 採取・入れるときにアニメーションを使う（同梱の Soulgem Oven 4 のアニメーション。FNIS/Nemesis の実行が必要）
bAnimations=1
; 採取・挿入のときに SexLab の声を鳴らす（SexLab.esm が必要）
bSounds=1
; 採取中に声を鳴らす間隔（秒）。採取の終わりに近づくほど強い声になる
fVoiceInterval=2.5
; 採取アニメーションの長さ（秒）。この後に精液が手に入る
fCollectSeconds=8.0
; 入れるアニメーションの長さ（秒）。この後におなかに入る
fInsertSeconds=4.0
; Fill Her Up で膨らむ量の倍率。
; 量 = Fill Her Up の MCM でその種族に設定した量（未設定は 0.75）× 等級（100%=1.0 / 50%=0.75 / 30%=0.5）× この値
fFHUAmount=1.0

[Camera]
; 採取・挿入のときのカメラ演出（全身 → 回り込み → 顔 → 戻る。黒帯・スロー付き）
bCamera=1
; 挿入のカメラの長さ（秒）：後ろ → ゆっくり前へ回り込み（全身） → 顔
fInsertCameraSeconds=7
; 挿入カメラの距離（1.0 = 標準、0.7 = もっと近く、1.5 = 離れる）。手元の動きを追いかけます
fInsertCameraZoom=1.0
; スローの速さ（1.0 = 通常、0.6 = 少しゆっくり）
fCameraSlowMo=0.6
; 全身を映すときの距離
fCameraBodyDistance=150
; 顔に寄るときの距離
fCameraFaceDistance=75
; 上下の黒帯（SKSE Menu Framework が必要）
bCameraLetterbox=1
; 画面の縁を暗くする
bCameraVignette=1

[Video]
; Beeing Female で排卵期に入ったとき、画面右上の小さなウィンドウで動画を流す
; 動画：Data\BFHeredity\Video\ovulation.mp4（音は同じ名前の .wav）。差し替えもできます
bOvulationVideo=1
; 動画の音を鳴らす
bVideoSound=1
; ウィンドウの幅（画面幅に対する割合。0.30 = 3割）
fVideoWidth=0.30
; テスト用：このキーを押すとすぐに動画を流す（0 = なし。例 0x44 = F10）
iVideoTestKey=0
