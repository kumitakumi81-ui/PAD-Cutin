; BF Heredity 0.2.0 設定
; Beeing Female NG のプレイヤーの子供が父母の見た目を受け継ぎ、付けた名前が残るようにする

[General]
; 父母の見た目を受け継ぐ
bInherit=1
; 生まれたときに名前の入力画面を出す
bNameOnBirth=1
; 子供に照準を合わせてこのキーを押すと名前を変えられる（DirectXキーコード。49 = N キー）
iRenameKey=49

[Inherit]
; 髪型・眉（子供の種族に合うものだけ）
bHairStyle=1
; 目
bEyes=1
; 顔の形（スライダーを父母の間で混ぜる）
bFaceShape=1
; 肌の色
bSkinTone=1

[DNA]
; DNA機能（NPCのDNAを採取して、使うと Fill Her Up と Beeing Female に反映）
bDNA=1
; NPCに照準を合わせてこのキーでDNAを採取（36 = J キー）
iCollectKey=36
; 男性からのみ採取できる
bMaleOnly=1
; 孕みやすさは、採取したときにそのNPCが溜めている量（Beeing Female の精力 0.02〜1.0）で決まる
; この値以上なら 100%
fVirility100=0.9
; この値以上なら 50%、それ未満は 30%
fVirility50=0.5
; DNAを使ったときの Fill Her Up の量
fFHUAmount=1.0
