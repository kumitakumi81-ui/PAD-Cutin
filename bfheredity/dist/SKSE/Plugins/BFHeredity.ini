; BF Heredity 0.2.0 設定
; Beeing Female NG のプレイヤーの子供が父母の見た目を受け継ぎ、付けた名前が残るようにする

[General]
; 父母の見た目を受け継ぐ
bInherit=1
; 生まれたときに名前の入力画面を出す
bNameOnBirth=1
; 子供に照準を合わせてこのキーを押すと名前を変えられる（DirectXキーコード。49 = N キー）
iRenameKey=49

[Inherit]
; 髪型・眉（子供の種族に合うものだけ）
bHairStyle=1
; 目
bEyes=1
; 顔の形（スライダーを父母の間で混ぜる）
bFaceShape=1
; 肌の色
bSkinTone=1

[DNA]
; 精液の採取機能（男性NPCに話しかけて採取し、使うと Fill Her Up と Beeing Female に反映）
bDNA=1
; 会話の代わりにキーでも採取したいときのキー（0 = 会話のみ。例：36 = J キー）
iCollectKey=0
; 男性からのみ採取できる
bMaleOnly=1
; 孕みやすさは、採取したときにそのNPCが溜めている量（Beeing Female の精力 0.02〜1.0）で決まる
; この値以上なら 100%
fVirility100=0.9
; この値以上なら 50%、それ未満は 30%
fVirility50=0.5
; 採取・入れるときにアニメーションを使う（同梱の Soulgem Oven 4 のアニメーション。FNIS/Nemesis の実行が必要）
bAnimations=1
; 採取アニメーションの長さ（秒）。この後に精液が手に入る
fCollectSeconds=8.0
; 入れるアニメーションの長さ（秒）。この後におなかに入る
fInsertSeconds=4.0
; Fill Her Up で膨らむ量の倍率。
; 量 = Fill Her Up の MCM でその種族に設定した量（未設定は 0.75）× 等級（100%=1.0 / 50%=0.75 / 30%=0.5）× この値
fFHUAmount=1.0
