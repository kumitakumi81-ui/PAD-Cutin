name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: CommonLibSSE-NG v9.3.0
        shell: bash
        run: |
          git clone --depth 1 --branch v9.3.0 https://github.com/alandtse/CommonLibVR.git extern/CommonLibSSE-NG
          git -C extern/CommonLibSSE-NG submodule update --init --recursive --depth 1
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 99a97de2cb371449d4fb9dc970f2ac562d689ec2
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DCOMMONLIB_PREBUILT=OFF
      - name: Build
        shell: cmd
        run: cmake --build build --target PADCutin
      - name: Package
        shell: bash
        run: |
          mkdir -p out/SKSE/Plugins
          cp build/PADCutin.dll out/SKSE/Plugins/
          cp dist/SKSE/Plugins/PADCutin.ini out/SKSE/Plugins/
          cp LICENSE.txt THIRD_PARTY_NOTICES.txt README_ja.txt out/
      - uses: actions/upload-artifact@v4
        with:
          name: PAD-Cutin
          path: out/
